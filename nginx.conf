server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # За прокси (Coolify/Traefik) nginx не знает про https и лепит в Location схему http://,
  # из-за чего /slug → http://…/slug/ → https://…/slug/ (лишний хоп + даунгрейд).
  # Относительные редиректы схему не трогают.
  absolute_redirect off;

  # склейка зеркал: www → без www (иначе оба хоста отдают 200 = дубли)
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  # безопасные заголовки
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;

  # Наследие домена: тысячи спам-URL прошлого владельца (гемблинг на вьетнамском) и
  # остатки старого WordPress. 410 Gone удаляет их из индекса заметно быстрее, чем 404.
  location ~* ^/(game|app|hot|mobile|order|news|app\d+|hot\d+)(/|$) {
    return 410;
  }
  location ~* ^/(wp-content|wp-admin|wp-includes|wp-json)(/|$) {
    return 410;
  }
  location ~* ^/(xmlrpc\.php|wp-login\.php)$ {
    return 410;
  }

  # кеш статики
  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
